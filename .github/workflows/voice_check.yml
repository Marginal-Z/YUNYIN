name: 离线声音检查

# 在 x64 与 ARM64（与手机相同的指令集）上用真实的 ZipVoice 模型合成五个音色，检查削波与毛刺，并上传合成的语音。
# 只在手动触发时运行（下载约 155 MB 模型）。
on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  voice:
    name: 离线声音 · ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # flutter-action 没有 Linux ARM64 的预编译包：直接取 Flutter 源码（首次运行时自动下载对应平台的 Dart SDK）。
      - name: 安装 Flutter（ARM64）
        if: matrix.arch == 'aarch64'
        run: |
          git clone --depth 1 -b "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
      - name: 下载 ZipVoice 模型与声码器
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          root="$RUNNER_TEMP/voices"
          mkdir -p "$root"
          base=https://github.com/k2-fsa/sherpa-onnx/releases/download
          tool/ci/gh_release_download.sh "$base/tts-models/sherpa-onnx-zipvoice-distill-int8-zh-en-emilia.tar.bz2" "$RUNNER_TEMP/zip.tar.bz2"
          echo "77219c8b40f4ee8d73a7f902305ff6c1128ef9b54461c41b4ca6ed890b6c2803  $RUNNER_TEMP/zip.tar.bz2" | sha256sum -c
          tar xjf "$RUNNER_TEMP/zip.tar.bz2" -C "$root"
          touch "$root/sherpa-onnx-zipvoice-distill-int8-zh-en-emilia/.ok"
          tool/ci/gh_release_download.sh "$base/vocoder-models/vocos_24khz.onnx" "$root/vocos_24khz.onnx"
          echo "bcb3b970e384161c4d634f0bb9e999ff1c471b34c9bc0b1049a5014065ed3cc0  $root/vocos_24khz.onnx" | sha256sum -c
          echo "YUNYIN_VOICE_ROOT=$root" >> "$GITHUB_ENV"
      - name: 合成并检查
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          export YUNYIN_VOICE_OUT="$RUNNER_TEMP/out"
          export SHERPA_LIB="$(find "${PUB_CACHE:-$HOME/.pub-cache}" -path '*sherpa_onnx_linux-*/linux/${{ matrix.arch }}' -type d | head -1)"
          flutter test test/voice_local_engine_test.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voices-${{ matrix.arch }}
          path: ${{ runner.temp }}/out
